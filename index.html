<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF4E6" />
    <meta name="description" content="A cozy little companion with one mission: get you outside. Less scrolling, more strolling." />
    <script>
      // Apply persisted appearance before the first paint. Keep the key in sync with appearance.ts.
      (() => {
        let mode = 'system';
        try { const saved = localStorage.getItem('outside-or-else:appearance'); if (saved === 'light' || saved === 'dark' || saved === 'dynamic') mode = saved; } catch {}
        const hour = new Date().getHours();
        const phase = hour < 6 ? 'night' : hour < 8 ? 'sunrise' : hour < 12 ? 'morning' : hour < 17 ? 'afternoon' : hour < 19 ? 'golden-hour' : hour < 20 ? 'blue-hour' : 'night';
        const night = (mode === 'dynamic' && (phase === 'night' || phase === 'blue-hour')) || mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = night ? 'dark' : 'light';
        document.documentElement.dataset.appearance = mode;
        document.documentElement.dataset.phase = mode === 'dynamic' ? phase : night ? 'night' : 'afternoon';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', night ? '#18243D' : '#FFF4E6');
      })();
    </script>
    <title>Outside or Else!</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
